<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>载波图片发送</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c1321;color:#dfebfc;font:16px system-ui,sans-serif}main{max-width:1120px;margin:32px auto;padding:0 24px}h1{font-size:28px}p{color:#a9bbd2;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{background:#152135;border:1px solid #2b3b52;border-radius:16px;padding:22px}canvas{display:block;max-width:100%;background:#080e18;border-radius:8px}#crop{width:100%;touch-action:none;cursor:grab}#preview{width:100%;max-height:420px;object-fit:contain;image-rendering:pixelated;margin:16px auto;background:white}label{display:block;margin:15px 0 7px}input[type=range]{width:100%}select,button,input[type=file]{font:inherit}select{padding:9px;background:#22334b;color:white;border:1px solid #425975;border-radius:7px}button{padding:12px 20px;border:0;border-radius:8px;background:#56d3af;color:#071a14;cursor:pointer;font-weight:650;margin:12px 8px 0 0}button.secondary{background:#30425e;color:white}button:disabled{opacity:.4;cursor:default}.row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.muted{font-size:14px;color:#a9bbd2}#status{white-space:pre-wrap;line-height:1.6}progress{width:100%;height:17px}#error{color:#ff9d9d}a{color:#8ccfff}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style><main><h1>通过载波发送图片</h1><p>上传 → 拖动裁切 → 黑白预览 → 发生器 CH2 发送。屏幕选择「图片」页及相同制式，通道 CH1、1000 Bd。</p>
<div class="grid"><section class="card"><h2>1 · 裁切图片</h2><input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/bmp"><p class="muted">拖动图片调整位置，滑块缩放；中心框就是发送区域，可选横图或方图。</p><canvas id="crop" width="480" height="480"></canvas><label>缩放 <span id="zoomValue">1.0×</span></label><input id="zoom" type="range" min="1" max="5" value="1" step="0.01"><button id="center" class="secondary">重新居中</button><label>黑白阈值 <span id="thresholdValue">128</span></label><input id="threshold" type="range" min="0" max="255" value="128"><label><input id="invert" type="checkbox"> 反转黑白</label></section>
<section class="card"><h2>2 · 预览与发送</h2><div class="row"><div><label>比例</label><select id="aspect"><option value="2">横图 2:1</option><option value="1">方图 1:1</option><option value="0.5" selected>竖图 1:2</option></select></div><div><label>宽度</label><select id="size"><option>32</option><option>64</option><option selected>128</option><option>256</option></select></div><div><label>调制制式</label><select id="mode"><option value="ook">OOK · 包络开关</option><option value="fsk">2FSK · 频率切换</option><option value="bpsk">BPSK · 相位翻转</option></select></div><div><label>整图轮数</label><select id="rounds"><option>1</option><option>2</option><option>3</option></select></div></div><canvas id="preview" width="32" height="32"></canvas><div id="estimate" class="muted"></div><p class="muted">固定 1 MHz 载波、1000 Bd；每包重复三次。结束后恢复原设置。网页只控制发生器，接收成功以屏端整图 CRC 为准。</p><button id="send" disabled>开始发送</button><button id="stop" class="secondary" disabled>停止并恢复</button><button id="download" class="secondary" disabled>保存预览 PNG</button><hr style="border:0;border-top:1px solid #30425e;margin:22px 0"><progress id="progress" max="100" value="0"></progress><div id="status">空闲</div><div id="error"></div></section></div></main>
<script>
const $=id=>document.getElementById(id), crop=$('crop'),ctx=crop.getContext('2d'),preview=$('preview'),pc=preview.getContext('2d');
$('threshold').previousElementSibling.insertAdjacentHTML('beforebegin',`<label for="dither">灰度处理方式</label><select id="dither"><option value="threshold">纯阈值 · 图标文字</option><option value="fs">Floyd–Steinberg · 照片推荐</option><option value="atkinson">Atkinson · 清晰轮廓</option><option value="jjn">Jarvis–Judice–Ninke · 柔和层次</option><option value="stucki">Stucki · 细腻渐变</option><option value="bayer4">Bayer 4×4 · 规则网点</option><option value="bayer8">Bayer 8×8 · 更多灰阶</option><option value="random">随机抖动 · 固定纹理</option></select><p id="ditherHint" class="muted"></p>`);
/* Pure image operation: one binary result drives preview, PNG and RF payload.
   Error diffusion uses alternating scan directions to avoid directional bias. */
function quantizeImage(rgba,w,h,mode='threshold',threshold=128,invert=false){
 const kernels={fs:{d:16,k:[[1,0,7],[-1,1,3],[0,1,5],[1,1,1]]},atkinson:{d:8,k:[[1,0,1],[2,0,1],[-1,1,1],[0,1,1],[1,1,1],[0,2,1]]},jjn:{d:48,k:[[1,0,7],[2,0,5],[-2,1,3],[-1,1,5],[0,1,7],[1,1,5],[2,1,3],[-2,2,1],[-1,2,3],[0,2,5],[1,2,3],[2,2,1]]},stucki:{d:42,k:[[1,0,8],[2,0,4],[-2,1,2],[-1,1,4],[0,1,8],[1,1,4],[2,1,2],[-2,2,1],[-1,2,2],[0,2,4],[1,2,2],[2,2,1]]}};
 if(!['threshold','fs','atkinson','jjn','stucki','bayer4','bayer8','random'].includes(mode))throw Error('未知抖动算法');
 const tone=new Float64Array(w*h),bits=new Uint8Array(Math.ceil(w/8)*h),out=new Uint8ClampedArray(w*h*4);
 for(let i=0;i<w*h;i++){let k=i*4,a=rgba[k+3]/255;let g=(.299*rgba[k]+.587*rgba[k+1]+.114*rgba[k+2])*a+255*(1-a);tone[i]=mode==='threshold'?g:Math.max(0,Math.min(255,g+128-threshold));}
 let matrix=[[0]];const bsize=mode==='bayer8'?8:4;
 while(matrix.length<bsize){let n=matrix.length,next=Array.from({length:n*2},()=>Array(n*2));for(let y=0;y<n;y++)for(let x=0;x<n;x++){let q=matrix[y][x]*4;next[y][x]=q;next[y][x+n]=q+2;next[y+n][x]=q+3;next[y+n][x+n]=q+1;}matrix=next;}
 for(let y=0;y<h;y++){
  const dir=kernels[mode]&&y%2?-1:1;
  for(let at=0;at<w;at++){
   let x=dir===1?at:w-1-at,i=y*w+x,old=tone[i],cut=mode==='threshold'?threshold:128;
   if(mode.startsWith('bayer'))cut=(matrix[y%bsize][x%bsize]+.5)*255/(bsize*bsize);
   if(mode==='random'){let q=Math.imul((x+1)^Math.imul(y+1,374761393),668265263);q=Math.imul(q^(q>>>13),1274126177);cut=(((q^(q>>>16))>>>0)+.5)*255/4294967296;}
   let black=old<cut,value=black?0:255;
   if(kernels[mode]){const ker=kernels[mode],error=old-value;for(let [dx,dy,weight] of ker.k){let nx=x+dx*dir,ny=y+dy;if(nx>=0&&nx<w&&ny<h)tone[ny*w+nx]+=error*weight/ker.d;}}
   if(invert)black=!black;
   if(black)bits[y*Math.ceil(w/8)+(x>>3)]|=1<<(7-(x&7));
   let k=i*4;out[k]=out[k+1]=out[k+2]=black?0:255;out[k+3]=255;
  }
 }
 return {bits,rgba:out};
}
let img=null,scale=1,ox=0,oy=0,drag=null,pixels=null,busy=false,pending=false,serviceReady=false;
function cropBox(){const a=Number($('aspect').value),w=a>=1?360:360*a,h=a>=1?360/a:360;return [(480-w)/2,(480-h)/2,w,h];}
function syncDimensions(changed){if(Number($('size').value)===256&&Number($('aspect').value)!==2){if(changed==='aspect')$('size').value='128';else $('aspect').value='2';}}
function bounds(){if(!img)return;let [x,y,w,h]=cropBox();scale=Math.min(w/img.width,h/img.height)*Number($('zoom').value);ox=img.width*scale<w?x+(w-img.width*scale)/2:Math.min(x,Math.max(x+w-img.width*scale,ox));oy=img.height*scale<h?y+(h-img.height*scale)/2:Math.min(y,Math.max(y+h-img.height*scale,oy));}
function centered(){if(!img)return;$('zoom').value=1;scale=Math.min(cropBox()[2]/img.width,cropBox()[3]/img.height);ox=(480-img.width*scale)/2;oy=(480-img.height*scale)/2;draw();}
function draw(){ctx.clearRect(0,0,480,480);if(img){bounds();ctx.drawImage(img,ox,oy,img.width*scale,img.height*scale);}ctx.fillStyle='#0009';let [x,y,w,h]=cropBox();ctx.fillRect(0,0,480,y);ctx.fillRect(0,y+h,480,480-y-h);ctx.fillRect(0,y,x,h);ctx.fillRect(x+w,y,480-x-w,h);ctx.strokeStyle='#56d3af';ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);$('zoomValue').textContent=Number($('zoom').value).toFixed(1)+'×';render();}
function render(){let n=Number($('size').value),height=n/Number($('aspect').value),packets=n*height/256;$('thresholdValue').textContent=$('threshold').value;$('ditherHint').textContent=$('dither').value==='threshold'?'直接按阈值分成黑白，适合图标和文字。':'用黑白像素疏密表现灰度，仍为1位黑白图，不增加字节数和发送时长。阈值越高整体越暗；照片建议128×128。';$('estimate').textContent=`${n} × ${height} · ${n*height/8} 字节 · ${packets} 包 · 播放约 ${(packets*6.144*Number($('rounds').value)).toFixed(1)} 秒（另需上传时间）`;preview.width=n;preview.height=height;if(!img)return;pc.imageSmoothingEnabled=true;pc.fillStyle="white";pc.fillRect(0,0,n,height);let [x,y,w,h]=cropBox();pc.drawImage(img,(x-ox)/scale,(y-oy)/scale,w/scale,h/scale,0,0,n,height);let d=pc.getImageData(0,0,n,height),result=quantizeImage(d.data,n,height,$('dither').value,Number($('threshold').value),$('invert').checked);pixels=result.bits;d.data.set(result.rgba);pc.putImageData(d,0,0);$('send').disabled=!serviceReady||busy||pending;$('download').disabled=false;}
$('file').onchange=()=>{let f=$('file').files[0];if(!f)return;if(f.size>20*1024*1024){alert('请使用小于20MB的图片');return;}let url=URL.createObjectURL(f),im=new Image();im.onload=()=>{URL.revokeObjectURL(url);if(im.width*im.height>40000000){alert('图片过大，请先缩小至4000万像素以内');return;}img=im;centered();};im.onerror=()=>{URL.revokeObjectURL(url);alert('图片读取失败');};im.src=url;};
function pos(e){let r=crop.getBoundingClientRect();return [480*(e.clientX-r.left)/r.width,480*(e.clientY-r.top)/r.height];}crop.onpointerdown=e=>{if(!img)return;crop.setPointerCapture(e.pointerId);let [x,y]=pos(e);drag=[x,y,ox,oy];};crop.onpointermove=e=>{if(!drag)return;let [x,y]=pos(e);ox=drag[2]+x-drag[0];oy=drag[3]+y-drag[1];draw();};crop.onpointerup=crop.onpointercancel=()=>drag=null;
$('aspect').onchange=()=>{syncDimensions('aspect');if(img)centered();else draw();};
$('zoom').oninput=()=>{if(!img)return;let old=scale;scale=Math.min(cropBox()[2]/img.width,cropBox()[3]/img.height)*Number($('zoom').value);ox=240-(240-ox)*scale/old;oy=240-(240-oy)*scale/old;draw();};$('center').onclick=centered;for(let id of ['threshold','invert','size','rounds','dither'])$(id).oninput=()=>{syncDimensions(id);draw();};
async function post(path,body){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Session-Token':'__TOKEN__'},body:JSON.stringify(body)});let j=await r.json();if(!r.ok)throw Error(j.error);return j;}
$('send').onclick=async()=>{if(!serviceReady||!pixels||busy||pending)return;pending=true;$('send').disabled=true;try{await post('/api/start',{pixels:btoa(String.fromCharCode(...pixels)),size:Number($('size').value),height:preview.height,mode:$('mode').value,rounds:Number($('rounds').value)});}catch(e){$('error').textContent=e.message;}finally{pending=false;await status();}};
$('stop').onclick=()=>post('/api/stop',{}).catch(e=>$('error').textContent=e.message);
$('download').onclick=()=>{let a=document.createElement('a');a.href=preview.toDataURL();a.download='发送预览.png';a.click();};
async function status(){try{let r=await fetch('/api/status'),s=await r.json();busy=s.busy;serviceReady=s.version==='__VERSION__';$('send').disabled=!serviceReady||!pixels||busy||pending;$('stop').disabled=!busy;$('progress').value=s.progress;$('status').textContent=s.phase+(s.crc32?'\n图片 CRC32：'+s.crc32:'')+(s.restored===true?'\n发生器原设置已回读核验恢复':'')+(s.report?'\n日志：'+s.report:'');$('error').textContent=s.error||'';if(!serviceReady){$('status').textContent='当前是旧版控制服务，已禁用新的发送任务';let a=document.createElement('a');a.href='http://127.0.0.1:8768/';a.textContent='打开修复版图片发送网页';$('error').replaceChildren('请使用独占控制修复版：',a);}}catch(e){serviceReady=false;$('send').disabled=true;$('error').textContent='本机服务未连接；关闭网页不会停止发送，请保持Python窗口运行。';}}setInterval(status,800);draw();status();
</script></html>
